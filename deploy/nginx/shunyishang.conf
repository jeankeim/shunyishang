# ============================================================
# 顺衣尚 API 生产 Nginx 配置（api.shunyishang.cn）
# 部署位置: /etc/nginx/conf.d/shunyishang.conf
# 变更后执行: nginx -t && systemctl reload nginx
#
# 包含:
# - HTTP → HTTPS 301 强制跳转
# - TLS 1.2/1.3 + HSTS
# - 安全响应头（nosniff / frame-ancestors / CSP / Referrer-Policy）
# - SSE 流式推荐所需的 proxy 参数（proxy_buffering off 等）
# ============================================================

# 隐藏 Nginx 版本号，减少指纹暴露
server_tokens off;

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name api.shunyishang.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.shunyishang.cn;

    # ---- TLS 证书（certbot 会自动管理这两行；手动证书按实际路径修改） ----
    ssl_certificate     /etc/nginx/ssl/api.shunyishang.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/api.shunyishang.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全响应头（always: 4xx/5xx 响应也携带） ----
    # HSTS: 一年内浏览器强制 HTTPS（确认 HTTPS 稳定后再上线本行，回退成本高）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 禁止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 禁止被 iframe 嵌套（防点击劫持）
    add_header X-Frame-Options "DENY" always;
    # API 域不渲染页面，CSP 全部锁死
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # 跨站请求不泄露完整 Referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 禁用敏感浏览器能力
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 上传图片（衣橱照片）最大 10MB
    client_max_body_size 10m;

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应关键配置（推荐打字机效果）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }

    # 除 /health 与 /api/ 外一律 404，不暴露 FastAPI docs 等内部路径
    location / {
        return 404;
    }
}
