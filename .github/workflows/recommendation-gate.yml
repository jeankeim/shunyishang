name: 推荐算法质量门禁

# 触发条件：
# - 对 main 的 PR，且改动涉及推荐引擎/评估框架时
# - 推送到 main 时做一次全量把关
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/recommendation/**"
      - "packages/ai_agents/**"
      - "apps/api/tests/evaluation/**"
      - ".github/workflows/recommendation-gate.yml"
  push:
    branches: [main]
    paths:
      - "packages/recommendation/**"
      - "apps/api/tests/evaluation/**"
  # 允许手动触发（可在 Actions 页面运行全量）
  workflow_dispatch:

# 同一分支上新提交自动取消旧的运行，节省额度
concurrency:
  group: reco-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recommendation-gate:
    name: 推荐评分门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # PR 用采样(500)快速反馈；push/手动触发跑全量
      - name: 运行质量门禁 (PR - 采样)
        if: github.event_name == 'pull_request'
        run: |
          python -m apps.api.tests.evaluation.ci_gate \
            --sample 500 --quiet --json gate_report.json

      - name: 运行质量门禁 (main / 手动 - 全量)
        if: github.event_name != 'pull_request'
        run: |
          python -m apps.api.tests.evaluation.ci_gate \
            --quiet --json gate_report.json

      # 无论通过与否都上传工件，便于回溯每次门禁的实测值
      - name: 上传门禁报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-gate-report
          path: gate_report.json
          retention-days: 30
